<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinity Outreach</title>
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Infinity">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var t=localStorage.getItem("infinity_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" type="image/png" href="img/infinity-64.png">
<link rel="apple-touch-icon" href="img/infinity-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brandbox"><img src="img/infinity-64.png" class="logoimg" alt="" width="40" height="40"><div><b>Infinity Outreach</b><small id="sync">Loading…</small></div></div>
    <div class="pbsel" id="pbsw"></div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="xpbox" id="xpbox"></div>
    <div class="themesw modesw" id="modesw" role="group" aria-label="Mode"></div>
    <div class="themesw" id="themesw" role="group" aria-label="Theme"></div>
  </aside>
  <div class="scrim" id="scrim" data-act="menu" hidden></div>
  <div class="mainc">
    <header class="topbar">
      <button class="menubtn" data-act="menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 id="page" class="ptitle">Dashboard</h1>
      <button class="searchbtn" data-act="search" aria-label="Search or ask"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Search playbooks, scripts, prospects…</span><kbd>/</kbd></button>
    </header>
    <main id="view"></main>
    <p class="warn foot">This app tracks and prompts. It does not send messages. Send LinkedIn messages and emails yourself, and only where the Spam Act basis is recorded.</p>
  </div>
</div>
<nav class="bottom" id="bottom" aria-label="Quick"></nav>
<div class="pal" id="pal" hidden>
  <div class="palbg" data-act="palclose"></div>
  <div class="palbox" role="dialog" aria-label="Search">
    <div class="palin"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="palq" type="search" placeholder="Search or ask a question…" autocomplete="off" aria-label="Search"><button class="b" data-act="palclose">Esc</button></div>
    <div class="palres" id="palres"></div>
  </div>
</div>
<div class="pal" id="termpop" hidden>
  <div class="palbg" data-act="termclose"></div>
  <div class="palbox tbox" role="dialog" aria-label="Definition"><div id="termbody" class="tbody"></div></div>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="content.js"></script>
<script src="content2.js"></script>
<script src="content3.js"></script>
<script src="find.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>
</body>
</html>
